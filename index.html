<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the right AI tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0e0e0e;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:3.5rem 2rem 5rem;position:relative;overflow:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none}
.orb1{width:600px;height:600px;top:-100px;left:-100px;background:radial-gradient(circle,rgba(0,180,90,0.09) 0%,transparent 70%)}
.orb2{width:500px;height:500px;bottom:-100px;right:-100px;background:radial-gradient(circle,rgba(0,180,90,0.06) 0%,transparent 70%)}
.inner{width:100%;max-width:700px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.icon-wrap{width:54px;height:54px;border-radius:16px;background:#0d2218;border:1.5px solid #1a3d28;display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem}
h1{font-size:3rem;font-weight:800;letter-spacing:-0.045em;line-height:1.05;text-align:center;margin-bottom:.75rem;color:#fff}
.subtitle{font-size:1rem;color:#555;text-align:center;margin-bottom:2.75rem;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin-bottom:2.5rem;width:100%}
.chip{font-size:.875rem;font-weight:500;padding:.55rem 1.1rem;border-radius:999px;border:1.5px solid #262626;background:#161616;color:#999;cursor:pointer;transition:all .15s ease;text-align:center;white-space:nowrap}
.chip:hover{border-color:#333;color:#ccc;background:#1c1c1c}
.chip.active{border-color:#00c864;color:#00c864;background:#0a1f12}
.search-wrap{width:100%;margin-bottom:1.75rem}
.search-box{width:100%;display:flex;align-items:center;background:#171717;border:1.5px solid #232323;border-radius:18px;padding:.75rem .75rem .75rem 1.25rem;gap:.75rem;transition:border-color .2s,box-shadow .2s}
.search-box:focus-within{border-color:#2a2a2a;box-shadow:0 0 0 3px rgba(0,200,100,0.08),0 0 25px rgba(0,200,100,0.1)}
.search-icon{flex-shrink:0;color:#3a3a3a;display:flex;align-items:center}
.search-input{flex:1;border:none;outline:none;background:transparent;color:#ddd;font-size:1rem;font-family:inherit;padding:.25rem 0;caret-color:#00c864}
.search-input::placeholder{color:#3a3a3a}
.send-btn{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:#222;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#888;transition:background .15s,color .15s,transform .1s}
.send-btn:hover{background:#2c2c2c;color:#fff}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{background:#181818;color:#2e2e2e;cursor:not-allowed}
.toggle-row{display:flex;align-items:center;gap:.625rem;cursor:pointer;user-select:none}
.tog{width:42px;height:24px;border-radius:12px;background:#1e1e1e;border:1.5px solid #2a2a2a;position:relative;transition:background .2s,border-color .2s;cursor:pointer;flex-shrink:0;padding:0}
.tog.on{background:#00c864;border-color:#00c864}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#3a3a3a;transition:transform .2s,background .2s}
.tog.on::after{transform:translateX(18px);background:#000}
.toggle-label{font-size:.9rem;color:#555}
#output{margin-top:2.5rem;width:100%}
.summary-bar{font-size:.8rem;color:#444;margin-bottom:1.25rem;padding:.7rem 1rem;background:#111;border-radius:10px;line-height:1.6;border-left:2px solid #1e1e1e}
.results{display:flex;flex-direction:column;gap:.875rem}
.tool-card{border:1px solid #1e1e1e;border-radius:14px;padding:1.375rem 1.5rem;background:#111;animation:fadeUp .3s ease forwards;opacity:0;transform:translateY(10px);transition:border-color .2s}
.tool-card:hover{border-color:#282828}
.tool-card.top{border-color:#1a2e20}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.tool-header{display:flex;align-items:flex-start;gap:.875rem;margin-bottom:.625rem}
.rank-badge{width:28px;height:28px;border-radius:8px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;background:#161616;color:#444;border:1px solid #222}
.rank-badge.r1{background:rgba(0,200,100,0.08);color:#00c864;border-color:rgba(0,200,100,0.18)}
.tool-name{font-size:1.0625rem;font-weight:600;color:#eee;margin-bottom:.2rem;line-height:1.3}
.tool-tagline{font-size:.8125rem;color:#444;line-height:1.45}
.hype-row{display:flex;align-items:center;gap:.625rem;margin:.75rem 0 .625rem}
.hype-track{flex:1;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden}
.hype-fill{height:100%;border-radius:2px;background:#00c864;opacity:.65;transition:width .9s ease}
.hype-word{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#2e2e2e;white-space:nowrap}
.hype-num{font-size:.6rem;font-weight:600;color:#2e2e2e;white-space:nowrap}
.pricing-pill{display:inline-flex;align-items:center;font-size:.6875rem;font-weight:500;padding:.22rem .65rem;border-radius:999px;border:1px solid;margin-bottom:.7rem}
.pricing-pill.open,.pricing-pill.free{background:rgba(0,200,100,0.07);border-color:rgba(0,200,100,0.2);color:#00c864}
.pricing-pill.paid{background:rgba(96,165,250,0.07);border-color:rgba(96,165,250,0.2);color:#60a5fa}
.pricing-pill.freemium{background:rgba(251,191,36,0.07);border-color:rgba(251,191,36,0.2);color:#fbbf24}
.tool-desc{font-size:.8125rem;color:#555;line-height:1.7}
.tool-link{display:inline-flex;align-items:center;gap:.25rem;margin-top:.875rem;font-size:.8rem;font-weight:500;color:#333;text-decoration:none;transition:color .15s}
.tool-link:hover{color:#00c864}
.state-msg{text-align:center;padding:3rem 1rem;color:#333;font-size:.9rem}
.ld{display:inline-flex;gap:5px;align-items:center;margin-left:6px;vertical-align:middle}
.ld span{width:5px;height:5px;border-radius:50%;background:#333;animation:bop .9s infinite}
.ld span:nth-child(2){animation-delay:.15s}.ld span:nth-child(3){animation-delay:.3s}
@keyframes bop{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.err{text-align:center;padding:1.25rem;font-size:.8125rem;color:#f87171;background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.12);border-radius:10px}
.footer{text-align:center;margin-top:4rem;font-size:.75rem;color:#252525}
</style>
</head>
<body>
<div class="page">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="inner">
    <div class="icon-wrap">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00c864" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
    </div>
    <h1>Find the right AI tool</h1>
    <p class="subtitle">Describe what you need — get the most hyped tools right now.</p>
    <div class="chips" id="chips"></div>
    <div class="search-wrap">
      <div class="search-box">
        <div class="search-icon">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </div>
        <input class="search-input" id="q" placeholder="What do you need to do?" autocomplete="off" spellcheck="false">
        <button class="send-btn" id="btn" onclick="doSearch()" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
    <div class="toggle-row" onclick="toggleOS()" role="switch" aria-checked="false" id="osSw" tabindex="0">
      <button class="tog" id="osTgl" tabindex="-1"></button>
      <span class="toggle-label">Open source only</span>
    </div>
    <div id="output"></div>
    <div class="footer">Powered by the latest AI discovery algorithms</div>
  </div>
</div>
<script>
const PROXY = '';  // same origin — Replit serves both
let osOnly = false;

const TRENDING = [
  'generate talking avatar videos',
  'remove objects from photos',
  'clone my voice',
  'turn sketches into UI',
  'summarise long YouTube videos',
  'create AI product photos'
];

function setChips(arr){
  document.getElementById('chips').innerHTML = arr.map(t =>
    `<span class="chip" onclick="fill('${t.replace(/'/g,"\\'")}',this)">${t}</span>`
  ).join('');
}

function toggleOS(){
  osOnly=!osOnly;
  document.getElementById('osTgl').classList.toggle('on',osOnly);
  document.getElementById('osSw').setAttribute('aria-checked',String(osOnly));
}
document.getElementById('osSw').addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'){e.preventDefault();toggleOS();}
});
function fill(t,el){
  document.getElementById('q').value=t;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el&&el.classList.add('active');
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch();}});
document.getElementById('q').addEventListener('input',()=>document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')));

async function api(body){
  const r = await fetch('/', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e?.error?.message||`HTTP ${r.status}`);}
  return r.json();
}
function xt(d){let s='';for(const b of d.content){if(b.type==='text'&&b.text)s+=b.text;}return s;}

async function doSearch(){
  const query=document.getElementById('q').value.trim();
  if(!query)return;
  const btn=document.getElementById('btn'),out=document.getElementById('output');
  btn.disabled=true;
  out.innerHTML=`<div class="state-msg">Searching...<div class="ld"><span></span><span></span><span></span></div></div>`;
  const osNote=osOnly?' Open source only.':'';
  try{
    const d = await api({
      model:'claude-sonnet-4-20250514',
      max_tokens:800,
      tools:[{"type":"web_search_20250305","name":"web_search"}],
      messages:[{role:'user',content:`Best AI tools for: "${query}"${osNote}. Search web for latest options. Return raw JSON only — no markdown: {"tools":[{"rank":1,"name":"","tagline":"","description":"2 sentences max","pricing":"free|paid|freemium|open-source","url":"","hype_score":0}],"summary":""}. Max 3 tools, sorted by hype_score desc.`}]
    });
    const t=xt(d);
    let p;
    try{ p=JSON.parse(t.replace(/```json|```/g,'').trim()); }
    catch{ out.innerHTML=`<div class="err">Couldn't parse results. Try rephrasing.</div>`;btn.disabled=false;return; }
    if(!p.tools?.length){ out.innerHTML=`<div class="state-msg">No tools found. Try being more specific.</div>`;btn.disabled=false;return; }
    const pm={'open-source':['open','🟢 Open source'],'free':['free','🟢 Free'],'paid':['paid','🔵 Paid'],'freemium':['freemium','🟡 Freemium']};
    let html=p.summary?`<div class="summary-bar">${p.summary}</div>`:'';
    html+='<div class="results">';
    for(const t of p.tools){
      const[cls,lbl]=pm[t.pricing]||['paid','🔵 Paid'];
      const domain=t.url?t.url.replace(/^https?:\/\//,'').split('/')[0]:'';
      const h=Math.min(100,Math.max(0,parseInt(t.hype_score)||60));
      const hw=h>=90?'Viral':h>=70?'High':h>=50?'Moderate':h>=30?'Growing':'Niche';
      html+=`<div class="tool-card${t.rank===1?' top':''}" style="animation-delay:${(t.rank-1)*100}ms">
        <div class="tool-header">
          <div class="rank-badge${t.rank===1?' r1':''}">${t.rank}</div>
          <div><div class="tool-name">${t.name}</div><div class="tool-tagline">${t.tagline}</div></div>
        </div>
        <div class="hype-row">
          <span class="hype-word">${hw}</span>
          <div class="hype-track"><div class="hype-fill" style="width:${h}%"></div></div>
          <span class="hype-num">${h}/100</span>
        </div>
        <div class="pricing-pill ${cls}">${lbl}</div>
        <div class="tool-desc">${t.description}</div>
        ${t.url?`<a class="tool-link" href="${t.url}" target="_blank">${domain} ↗</a>`:''}
      </div>`;
    }
    html+='</div>';
    out.innerHTML=html;
  }catch(e){
    out.innerHTML=`<div class="err">Search failed: ${e.message}</div>`;
  }
  btn.disabled=false;
}

setChips(TRENDING);
</script>
</body>
</html>
